<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is It Worth It? Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="iconOuter">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1>Is It Worth It?</h1>
            <p class="subtitle">Find out the real cost of your purchase</p>
        </div>

        <div class="card">
            <div class="input">
                <label for="price">Item Price</label>
                <div class="priceInput">
                    <span class="symbol">€</span>
                    <input type="number" id="price" value="0" step="0.01" min="0">
                </div>
            </div>

            <div class="input">
                <label>How often will you use it?</label>
                <div class="freqButtons">
                    <button class="freqBtn active" data-freq="Daily">Daily</button>
                    <button class="freqBtn" data-freq="Weekly">Weekly</button>
                    <button class="freqBtn" data-freq="Monthly">Monthly</button>
                    <button class="freqBtn" data-freq="Custom">Custom</button>
                </div>
            </div>

            <div class="input">
                <label for="uses">Number of Uses</label>
                <input type="number" id="uses" value="1" min="1">
            </div>
        </div>

        <div class="resultCard" id="resultCard">
            <p class="resultLabel">Cost per use</p>
            <p class="resultAmount" id="costAmount">€0.00</p>
            <span class="verdictBadge" id="verdictBadge">Input a price!</span>
        </div>

        <p class="footerTxt">Enter a price and usage to see your cost per use</p>
    </div>
</body>
</html>
